<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="20">
<title>Webseiten-Check</title>
<style>
  body { margin: 0; background: #0A0E1A; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; min-height: 100vh; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 28px; margin: 0 0 12px; }
  p { color: #C7CEDD; font-size: 18px; line-height: 1.5; max-width: 36ch; margin: 0 auto 16px; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #9652E8; animation: pulse 1.4s infinite; margin-bottom: 20px; }
  @keyframes pulse { 0%,100% { opacity: .3; transform: scale(.8);} 50% { opacity: 1; transform: scale(1.2);} }
</style>
</head>
<body>
<main>
  <span class="dot"></span>
  <h1>Hier entsteht gerade eine Anwendung.</h1>
  <p>Diese Seite lädt sich alle 20 Sekunden neu.</p>
</main>
</body>
</html>
